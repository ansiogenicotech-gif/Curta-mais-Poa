 A.querySelectorAll('[data-cv]').forEach(b=>b.onclick=()=>{const c=$('c'+b.dataset.cv),o=c.classList.toggle('open');b.textContent=o?'Ocultar comentários':'Ver todos os '+(S.cm[b.dataset.cv]||[]).length+' comentários'});
 A.querySelectorAll('[data-cf]').forEach(b=>b.onclick=()=>{const i=$('ci'+b.dataset.cf);i.scrollIntoView({block:'center'});i.focus()});
 A.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Excluir esta publicação?')){await dbDel(b.dataset.del);loadUP()}})}
function cpost(id){const i=$('ci'+id),t=i.value.trim();if(!t)return;(S.cm[id]=S.cm[id]||[]).push({u:S.nome||'Você',t});save();i.value='';const b=$('cb'+id);b.innerHTML=cbH(id);wire(b)}
function postH(f){const on=!!S.lk[f.id],n=(f.t=='u'?0:40+hh(f.id)%460)+(on?1:0),g='linear-gradient('+f.g[0]+','+f.g[1]+')';
 return '<article class="po"><header><div class="av2" style="background:'+g+'">'+f.em+'</div><div><b>'+E(cl(f.n))+'</b><small>📍 '+E(f.b)+'</small></div>'+(f.mine?'<button class="tg h" data-del="'+f.id+'">Excluir</button>':'<span class="tg'+(f.t=='v'?' h':'')+'">'+E(f.tag)+'</span>')+'</header>'
 +'<div class="ph" data-d="'+f.id+'" style="background:'+g+'">'+(f.src?'<video src="'+f.src+'" controls playsinline preload="metadata"></video>':f.img?'<img src="'+E(f.img)+'" loading="lazy" alt="">':'<span>'+f.em+'</span>')+'<i class="bh">❤</i></div>'
 +'<div class="ac"><button class="lk'+(on?' on':'')+'" data-lk="'+f.id+'" aria-label="Curtir">'+IC.heart+'</button><button data-cf="'+f.id+'" aria-label="Comentar">'+IC.cm+'</button><button data-sh="'+f.id+'" aria-label="Compartilhar">'+IC.send+'</button>'+(f.t=='u'?'':'<button data-mp="'+E(f.pl||cl(f.n)+' '+f.b)+'" aria-label="Como chegar">'+IC.pin+'</button>')
 +(f.wa?'<a class="wa" target="_blank" rel="noopener" href="'+waU(f)+'">'+IC.wa+' WhatsApp</a>':'')+'</div>'
 +'<div class="lc" id="n'+f.id+'">'+n+' curtidas</div><p><b>'+E(cl(f.n))+'</b> '+E(f.tx||'')+(f.wa?'<small>Contato de exemplo: troque pelo WhatsApp real da empresa.</small>':'')+'</p>'
 +'<div id="cb'+f.id+'">'+cbH(f.id)+'</div><div class="cr"><input id="ci'+f.id+'" data-i="'+f.id+'" placeholder="Adicione um comentário..." maxlength="300"><button data-cp="'+f.id+'">Publicar</button></div></article>'}
loadUP();

render();loadW();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
