const unit=()=>S.md=='h'?(S.n==1?'hora':'horas'):(S.n==1?'dia':'dias');
const MX=()=>S.md=='h'?16:14;
function score(p,k,used,area,rain,all){let s=S.i.includes(p.c)?4:(S.i.length?0:1.5);if(!p.s.includes(k))s-=5;if(k=='l'&&p.c=='Culinária')s+=3;
 if(p.b==area)s+=1.5;if(rain){s+=p.i?2:-2}if(p.$>S.b)s-=6;if(used.has(p.id))s-=99;if(all&&all.has(p.id))s-=6;return s+Math.random()*.8}
function gen(){const nd=S.md=='h'?1:S.n,all=new Set(),days=[];
 for(let d=0;d<nd;d++){const rain=!!(W&&W.daily&&W.daily.precipitation_probability_max[d]>60);
  const st=tm(S.t0),en=S.md=='h'?st+S.n*60:Math.max(tm(S.t1),st+90);let t=st,area=S.c?'Centro':'';const day=new Set(),it=[];
  while(it.length<12&&en-t>=45){const k=SL(t),rem=en-t;
   const c=Object.values(PM).map(p=>[score(p,k,day,area,rain,all),p]).sort((x,y)=>y[0]-x[0])[0];
   if(c[0]<-12)break;const p=c[1],dur=Math.max(45,Math.round(Math.min(p.h*60,rem)/15)*15);
   it.push({id:p.id,s:t,e:t+dur,k});day.add(p.id);all.add(p.id);area=p.b;t+=dur+20}
  days.push({rain,it})}
 S.r={md:S.md,n:S.n,days};save()}
function swap(di,si){const day=S.r.days[di],o=day.it[si],used=new Set(day.it.map(x=>x.id)),area=PM[o.id].b;
 const c=Object.values(PM).filter(p=>p.id!=o.id).map(p=>[score(p,o.k,used,area,day.rain,null),p]).sort((x,y)=>y[0]-x[0])[0][1];o.id=c.id;save();render()}
function shareTxt(){return 'Meu roteiro Curta+Poa\n'+S.r.days.map((d,i)=>(S.r.days.length>1?'Dia '+(i+1)+'\n':'')+d.it.map(x=>'• '+fmt(x.s)+' '+PM[x.id].n).join('\n')).join('\n')}
function rot(A){
 const o=(arr,cur,k)=>arr.map(a=>'<button class="opt'+(cur(a[0])?' on':'')+'" data-'+k+'="'+a[0]+'">'+a[1]+'</button>').join('');
 const pre=(S.md=='h'?[1,2,4,6,8,12]:[1,2,3,5,7,10]).map(v=>[v,v+(S.md=='h'?'h':(v==1?' dia':' dias'))]);
 let h='<h2>Quanto tempo você tem?</h2><div class="card"><div class="seg"><button data-md="h" class="'+(S.md=='h'?'on':'')+'">⏱ Horas</button><button data-md="d" class="'+(S.md=='d'?'on':'')+'">📆 Dias</button></div>'
 +'<div class="big"><button id="bm" aria-label="Menos">−</button><div><b id="val">'+S.n+'</b><span id="un">'+unit()+'</span></div><button id="bp" aria-label="Mais">+</button></div>'
 +'<input type="range" id="rg" min="1" max="'+MX()+'" value="'+S.n+'" aria-label="Tempo disponível"><div class="opts" style="margin-top:14px;justify-content:center">'+o(pre,k=>S.n==k,'pn')+'</div>'
 +(S.md=='h'?'<label class="l">Começa às</label><input type="time" id="t0" value="'+S.t0+'"><div class="meta" id="eh" style="margin-top:8px"></div>':'<div class="two"><div><label class="l">Começa às</label><input type="time" id="t0" value="'+S.t0+'"></div><div><label class="l">Termina às</label><input type="time" id="t1" value="'+S.t1+'"></div></div>')+'</div>'
 +'<h2>Seu perfil</h2><div class="card"><label class="l" style="margin-top:0">O que você curte? (escolha vários)</label><div class="opts">'+INT.map(i=>'<button class="opt'+(S.i.includes(i)?' on':'')+'" data-i="'+i+'">'+i+'</button>').join('')+'</div>'
 +'<label class="l">Quanto quer gastar por passeio?</label><div class="opts">'+o([[0,'Só grátis'],[1,'Econômico'],[2,'Moderado'],[3,'Sem limite']],k=>S.b==k,'b')+'</div>'
 +'<label class="l">De onde você sai?</label><div class="opts">'+o([['aero','✈️ Aeroporto'],['rod','🚌 Rodoviária'],['cen','🏨 Centro/Hotel']],k=>S.c==k,'c')+'</div>'
 +'<div style="margin-top:20px"><button class="btn p" id="bG" style="width:100%;font-size:17px;padding:14px">✨ Criar meu roteiro</button></div></div>';
 if(S.r){h+='<h2>Seu roteiro</h2>';if(!S.r.days.some(d=>d.it.length))h+='<div class="warn">O tempo escolhido é curto demais. Aumente as horas ou os dias.</div>';
  S.r.days.forEach((d,di)=>{h+='<div class="day"><span>'+(S.r.days.length>1?'Dia '+(di+1):(S.r.md=='h'?S.r.n+'h de passeio':'1 dia'))+'</span><small>'+(d.rain?'🌧️ chuva prevista: priorizei lugares cobertos':'')+'</small></div>';
  d.it.forEach((x,si)=>{const p=PM[x.id];h+='<div class="card stop"><div class="slot">'+fmt(x.s)+' – '+fmt(x.e)+' • '+KL[x.k]+'</div><h3>'+E(p.n)+'</h3><div class="meta">📍 '+E(p.b)+' • '+(p.$?'$'.repeat(p.$):'Grátis')+'</div><div style="margin-bottom:10px">'+E(p.d)+'</div><span class="pill">'+p.c+'</span><span class="pill c">'+(p.i?'Coberto':'Ao ar livre')+'</span><div class="row" style="margin-top:12px"><a class="btn s t" target="_blank" rel="noopener" href="'+maps(p.n)+'">Como chegar</a><button class="btn s" data-sw="'+di+','+si+'">🔄 Trocar</button></div></div>'})});
  if(S.r.n>5&&S.r.md=='d')h+='<div class="warn">Em roteiros longos alguns lugares se repetem. Aproveite para explorar com calma.</div>';
  h+='<div class="row"><button class="btn" id="bS">📤 Compartilhar roteiro</button><button class="btn" id="bX">Limpar</button></div>'}
 A.innerHTML=h;
 const eh=()=>{if($('eh'))$('eh').textContent='Termina por volta das '+fmt(tm(S.t0)+S.n*60)};
 const setN=v=>{v=Math.max(1,Math.min(MX(),+v||1));S.n=v;save();$('val').textContent=v;$('un').textContent=unit();$('rg').value=v;eh();A.querySelectorAll('[data-pn]').forEach(b=>b.classList.toggle('on',+b.dataset.pn==v))};
 eh();
 A.querySelectorAll('[data-md]').forEach(b=>b.onclick=()=>{S.md=b.dataset.md;S.n=S.md=='h'?4:1;save();rot(A)});
 $('bm').onclick=()=>setN(S.n-1);$('bp').onclick=()=>setN(S.n+1);$('rg').oninput=e=>setN(e.target.value);
 A.querySelectorAll('[data-pn]').forEach(b=>b.onclick=()=>setN(b.dataset.pn));
 $('t0').onchange=e=>{S.t0=e.target.value||'09:00';save();eh()};if($('t1'))$('t1').onchange=e=>{S.t1=e.target.value||'22:00';save()};
 A.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const i=b.dataset.i;S.i=S.i.includes(i)?S.i.filter(x=>x!=i):[...S.i,i];save();b.classList.toggle('on')});
 A.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{S.b=+b.dataset.b;save();rot(A)});
 A.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.c=b.dataset.c;save();rot(A)});
 $('bG').onclick=()=>{gen();rot(A);setTimeout(()=>{const d=A.querySelector('.day');d&&d.scrollIntoView({behavior:'smooth'})},50)};
 A.querySelectorAll('[data-sw]').forEach(b=>b.onclick=()=>{const q=b.dataset.sw.split(',');swap(+q[0],+q[1])});
 if($('bS'))$('bS').onclick=async()=>{const t=shareTxt();try{if(navigator.share)await navigator.share({text:t});else{await navigator.clipboard.writeText(t);alert('Roteiro copiado!')}}catch(e){}};
 if($('bX'))$('bX').onclick=()=>{S.r=null;save();rot(A)};
}
function mob(A){
 const tip={aero:'<b>✈️ Saindo do Aeroporto Salgado Filho</b><br>O Trensurb liga o aeroporto ao Centro (estação Mercado) em cerca de 20 a 25 minutos, com parada na Rodoviária. Táxi e apps também saem do desembarque.',rod:'<b>🚌 Saindo da Rodoviária</b><br>A estação do Trensurb fica perto e leva ao Centro em poucos minutos. Táxi e apps são alternativas, principalmente com bagagem.',cen:'<b>🏨 No Centro</b><br>Muitos pontos turísticos ficam a pé: Mercado Público, Praça da Alfândega, Usina do Gasômetro e Cais Mauá.'}[S.c]||'<b>Escolha de onde você sai</b> na aba Roteiro ou na tela inicial para ver dicas personalizadas.';
 const L=(u,e,t,s)=>'<a class="card" style="display:block;color:inherit;text-decoration:none" target="_blank" rel="noopener" href="'+u+'"><b>'+e+' '+t+'</b><div class="meta" style="margin:2px 0 0">'+s+'</div></a>';
 A.innerHTML='<h2>Como se locomover</h2><div class="card" style="border-left:6px solid var(--co)">'+tip+'</div>'
 +'<h2>Traçar rota</h2><div class="card"><label class="l" style="margin-top:0">Para onde você vai?</label><select id="mD">'+Object.values(PM).map(p=>'<option value="'+E(p.n)+'">'+E(p.n)+'</option>').join('')+'</select><div class="row" style="margin-top:12px"><button class="btn t" data-m="driving">🚗 Carro/App</button><button class="btn t" data-m="transit">🚌 Ônibus/Trem</button><button class="btn t" data-m="walking">🚶 A pé</button><button class="btn t" data-m="bicycling">🚲 Bike</button></div></div>'
 +'<h2>Chamar transporte</h2>'+L('https://m.uber.com/','🚕','Uber','Abrir o app ou site')+L('https://99app.com/','🚖','99','Abrir o app ou site')+L('https://www.trensurb.gov.br/','🚆','Trensurb','Horários e estações')+L('https://eptc.portoalegre.rs.gov.br/','🚌','Ônibus e lotação (EPTC)','Informações oficiais de transporte')+L('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent('patinete compartilhado Porto Alegre'),'🛴','Patinetes e bicicletas compartilhadas','Veja o que há perto de você no mapa');
 A.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>open(maps($('mD').value,b.dataset.m),'_blank'));
}
function common(a,b){return a.filter(x=>b.includes(x))}
function con(A){
 let h='<h2>Conectar</h2><div class="warn">Protótipo: os perfis e benefícios abaixo são de demonstração. Para ligar pessoas reais é preciso um servidor. Encontre sempre em locais públicos.</div>';
 h+='<div class="card"><label class="l" style="margin-top:0">Seu nome</label><input id="nm" value="'+E(S.nome)+'" placeholder="Como quer ser chamado?"><div class="meta" style="margin-top:8px">Seus interesses vêm da aba Roteiro: <b>'+(S.i.join(', ')||'nenhum ainda')+'</b></div></div>';
 const q=PERF.filter(p=>common(S.i,p.i).length);
 if(nowMatch){const p=nowMatch,cm=common(S.i,p.i),rt=Object.values(PM).filter(x=>cm.includes(x.c)).slice(0,4);
  h+='<div class="sw"><div class="av">💞</div><h3>Deu match com '+E(p.n)+'!</h3><div class="meta">Interesses em comum: '+cm.join(', ')+'</div><div style="text-align:left;margin-top:10px"><b>Rota em dupla sugerida</b><br>'+rt.map(x=>'• '+E(x.n)).join('<br>')+'</div><div class="vou">🎁 '+PARC[S.v%PARC.length]+'<br><small>Código: POA-'+(1000+S.m.length*37)+' (exemplo)</small></div><button class="btn p" id="bK" style="margin-top:14px">Continuar</button></div>'}
 else if(!S.i.length)h+='<div class="card">Escolha seus interesses na aba Roteiro para ver pessoas com gostos parecidos.</div>';
 else if(!q.length)h+='<div class="card">Ninguém com esses interesses por enquanto. Tente marcar mais opções.</div>';
 else{const p=q[deck%q.length],cm=common(S.i,p.i);h+='<div class="sw"><div class="av">'+E(p.n[0])+'</div><h3>'+E(p.n)+'</h3><div class="meta">Vem de '+E(p.c)+'</div><p>'+E(p.b)+'</p><div style="margin-top:10px">'+p.i.map(i=>'<span class="pill'+(cm.includes(i)?'':' c')+'">'+i+'</span>').join('')+'</div><div class="meta" style="margin-top:8px">'+cm.length+' interesse(s) em comum</div><div class="acts"><button id="bN" aria-label="Passar">✖️</button><button id="bY" aria-label="Curtir">💚</button></div></div>'}
 if(S.m.length)h+='<h2>Seus matches</h2>'+S.m.map(n=>'<div class="card">💞 <b>'+E(n)+'</b></div>').join('');
 A.innerHTML=h;
 $('nm').oninput=e=>{S.nome=e.target.value;save()};
 if($('bN'))$('bN').onclick=()=>{deck++;con(A)};
 if($('bY'))$('bY').onclick=()=>{const p=q[deck%q.length];if(!S.m.includes(p.n))S.m.push(p.n);S.v++;save();nowMatch=p;deck++;con(A)};
 if($('bK'))$('bK').onclick=()=>{nowMatch=null;con(A)};
}
function eve(A){
 const t=todayEv().map(e=>e.n);
 A.innerHTML='<h2>Agenda de Porto Alegre</h2><div class="warn">Eventos fixos e de temporada. Datas mudam, então confirme antes de ir.</div>'
 +EV.map(e=>'<div class="card"><b>'+E(e.n)+'</b> '+(t.includes(e.n)?'<span class="pill">hoje</span>':'')+'<div class="meta">🗓 '+E(e.h)+' • 📍 '+E(e.l)+'</div>'+E(e.t)+'</div>').join('')
 +'<h2>Mais eventos</h2><div class="row"><a class="btn t" target="_blank" rel="noopener" href="https://www.google.com/search?q='+encodeURIComponent('eventos em Porto Alegre esta semana')+'">Eventos desta semana</a><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/search?q='+encodeURIComponent('agenda shows e teatro Porto Alegre')+'">Shows e teatro</a><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/search?q='+encodeURIComponent('jogos Grêmio Inter Porto Alegre próximos')+'">Jogos</a></div>';
}

if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
